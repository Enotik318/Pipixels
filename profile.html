<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Профиль — Pixel Battle</title>
<style>
  :root {
    --bg: #050506;
    --ink: #f5f5f7;
    --mute: #8b8b96;
    --line: rgba(255,255,255,.1);
    --card: rgba(255,255,255,.035);
    --soft: rgba(255,255,255,.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink);
    background: #000;
    font: 14px/1.45 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .page {
    min-height: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 20px 56px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 190px;
    gap: 28px;
    align-items: start;
  }
  .main { min-width: 0; }
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }
  .brand { font-weight: 700; font-size: 24px; letter-spacing: -.04em; }
  .brand span {
    display: block; margin-top: 5px; color: var(--mute);
    font-size: 12px; font-weight: 500;
  }
  .btn {
    height: 40px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: rgba(255,255,255,.03);
  }
  .btn:hover { background: rgba(255,255,255,.07); }
  .btn.pri {
    background: #fff; color: #111; border-color: #fff; font-weight: 600;
  }
  .btn.danger {
    border-color: rgba(255,80,80,.35);
    color: #ff8a8a;
  }
  .stack { display: grid; gap: 16px; }

  .card {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), transparent 40%), var(--card);
    padding: 20px;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(600px 180px at 10% -10%, rgba(255,255,255,.07), transparent 60%);
  }
  .card > * { position: relative; }
  .card h2 {
    margin: 0 0 16px;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--mute); font-weight: 650;
  }

  .hero {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 18px;
    align-items: center;
  }
  .av-wrap { position: relative; width: 96px; height: 96px; }
  .av-ring {
    position: absolute; inset: -5px; border-radius: 50%;
    background: conic-gradient(from 180deg, #fff, #555, #fff, #888, #fff);
    opacity: .5;
  }
  .av {
    position: relative; width: 96px; height: 96px; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
    font-weight: 700; font-size: 36px; letter-spacing: -.03em;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 14px 32px rgba(0,0,0,.45);
  }
  .hero-meta b {
    display: block; font-size: 28px; letter-spacing: -.03em; margin-bottom: 4px;
  }
  .hero-meta small {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--mute); font-size: 12px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #3dd68c;
    box-shadow: 0 0 0 3px rgba(61,214,140,.15);
  }
  .hero-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat {
    position: relative; padding: 16px; border-radius: 16px;
    border: 1px solid var(--line); background: rgba(0,0,0,.28); overflow: hidden;
  }
  .stat b {
    display: block; font-size: 26px; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; margin-bottom: 4px;
  }
  .stat span { color: var(--mute); font-size: 12px; }
  .stat-foot { margin-top: 14px; color: var(--mute); font-size: 12px; line-height: 1.45; }

  .rows { display: grid; gap: 8px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(0,0,0,.22);
  }
  .row strong { display: block; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .row em { display: block; font-style: normal; color: var(--mute); font-size: 12px; }
  .row select, .row input[type="range"] {
    min-width: 140px;
  }
  .row select {
    height: 36px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(0,0,0,.35);
    padding: 0 10px;
  }
  .row input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 99px;
    background: rgba(255,255,255,.12);
  }
  .row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 0;
  }
  .val {
    min-width: 36px;
    text-align: right;
    color: var(--mute);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .tg {
    position: relative; width: 50px; height: 30px; border: 0; border-radius: 999px;
    background: #2a2a31; padding: 0; flex: none; transition: background .15s;
  }
  .tg::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); transition: transform .18s ease;
  }
  .tg.on { background: #fff; }
  .tg.on::after { transform: translateX(20px); background: #111; }

  .seg {
    display: flex; gap: 4px; padding: 3px;
    border: 1px solid var(--line); border-radius: 12px; background: rgba(0,0,0,.25);
  }
  .seg button {
    height: 32px; padding: 0 12px; border: 0; border-radius: 9px;
    background: transparent; color: var(--mute); font-size: 12px;
  }
  .seg button.on {
    background: #fff; color: #111; font-weight: 600;
  }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button {
    height: 36px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent;
  }
  .tabs button.on { background: #fff; color: #111; border-color: #fff; font-weight: 600; }
  label {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 12px; color: var(--mute); font-size: 12px;
  }
  label input {
    height: 46px; padding: 0 14px; border: 1px solid var(--line);
    border-radius: 14px; background: rgba(0,0,0,.35);
  }
  label input:focus { outline: none; border-color: rgba(255,255,255,.28); }
  .err { min-height: 18px; color: #ff6b6b; font-size: 13px; margin: 0 0 8px; }
  .note { color: var(--mute); font-size: 12px; line-height: 1.45; margin: 12px 0 0; }
  .ok { color: #7ddea0; font-size: 12px; margin: 8px 0 0; min-height: 16px; }

  .rail { position: sticky; top: 28px; }
  .rail-label {
    margin: 0 0 10px; color: var(--mute); font-size: 11px;
    font-weight: 650; letter-spacing: .1em; text-transform: uppercase;
  }
  .can {
    width: 100%; max-width: 170px; margin-left: auto;
    border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.12); background: #000;
    aspect-ratio: 3 / 4.2;
    box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 18px 40px rgba(0,0,0,.55);
  }
  #bgVideo {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(.95) contrast(1.06);
  }
  .rail-cap {
    max-width: 170px; margin: 10px 0 0 auto;
    color: var(--mute); font-size: 12px; line-height: 1.4; text-align: right;
  }

  @media (max-width: 860px) {
    .page { grid-template-columns: 1fr; max-width: 560px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .rail {
      position: relative; top: 0; order: -1;
      display: flex; align-items: center; gap: 14px;
    }
    .can { width: 110px; margin: 0; }
    .rail-cap { margin: 0; text-align: left; max-width: none; }
    .rail-label { display: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="main">
      <div class="top">
        <div class="brand">
          pixel battle
          <span>профиль · аккаунт · настройки</span>
        </div>
        <a class="btn" href="index.html">К полю</a>
      </div>
      <div class="stack">
        <section class="card" id="accountCard"></section>
        <section class="card" id="statsCard"></section>
        <section class="card" id="settingsCard"></section>
        <section class="card" id="extraCard"></section>
      </div>
    </div>
    <aside class="rail">
      <div class="rail-label">Loop</div>
      <div class="can">
        <video id="bgVideo" autoplay muted loop playsinline>
          <source src="media/can.mp4" type="video/mp4" />
        </video>
      </div>
      <div class="rail-cap">маленький loop справа</div>
    </aside>
  </div>

<script>
(function () {
  "use strict";
  const TOKEN_KEY = "pixelbattle.token.v1";
  const SETTINGS_KEY = "pixelbattle.settings.v1";
  const API = (location.hostname.indexOf("onrender.com") !== -1) ? "" : "https://pipixels.onrender.com";

  const DEFAULTS = {
    fx: true,
    sound: true,
    volume: 0.6,
    showHud: true,
    showGrid: false,
    showCoords: true,
    autoCenter: true,
    reducedMotion: false,
    confirmPlace: false,
    accent: "mono",
    quality: "high",
    zoomStep: "normal"
  };

  function loadJSON(k, f) {
    try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch (e) { return f; }
  }
  function saveJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
  function fmt(n) { return Number(n || 0).toLocaleString("ru"); }
  function ini(n) { return n ? Array.from(n)[0].toUpperCase() : "?"; }
  function avColor(n) {
    if (!n) return "#3a3a42";
    var h = 0;
    for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360;
    return "hsl(" + h + " 58% 42%)";
  }

  var token = localStorage.getItem(TOKEN_KEY) || "";
  var me = null;
  var settings = Object.assign({}, DEFAULTS, loadJSON(SETTINGS_KEY, {}));

  async function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (token) headers.Authorization = "Bearer " + token;
    var res = await fetch(API + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) {
      var err = new Error((data && data.error) || ("Ошибка " + res.status));
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  var accountCard = document.getElementById("accountCard");
  var statsCard = document.getElementById("statsCard");
  var settingsCard = document.getElementById("settingsCard");
  var extraCard = document.getElementById("extraCard");
  var video = document.getElementById("bgVideo");
  video.muted = true;
  video.play().catch(function () {});

  function saveSettings() { saveJSON(SETTINGS_KEY, settings); }

  function bindTg(id, key) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle("on", !!settings[key]);
    el.onclick = function () {
      settings[key] = !settings[key];
      saveSettings();
      el.classList.toggle("on", !!settings[key]);
      flash();
    };
  }

  function flash() {
    var n = document.getElementById("saveNote");
    if (!n) return;
    n.textContent = "Сохранено";
    clearTimeout(flash._t);
    flash._t = setTimeout(function () { n.textContent = ""; }, 1200);
  }

  function renderSettings() {
    settingsCard.innerHTML =
      "<h2>Настройки поля</h2>" +
      "<div class=\"rows\">" +
        "<div class=\"row\"><div><strong>Анимация куба</strong><em>вспышка при постановке</em></div><button type=\"button\" class=\"tg\" id=\"tgFx\"></button></div>" +
        "<div class=\"row\"><div><strong>Звук</strong><em>клик при каждом пикселе</em></div><button type=\"button\" class=\"tg\" id=\"tgSound\"></button></div>" +
        "<div class=\"row\"><div><strong>Громкость</strong><em>сила звука клика</em></div><input type=\"range\" id=\"rngVol\" min=\"0\" max=\"100\" value=\"" + Math.round((settings.volume || 0.6) * 100) + "\" /><span class=\"val\" id=\"volVal\">" + Math.round((settings.volume || 0.6) * 100) + "%</span></div>" +
        "<div class=\"row\"><div><strong>Координаты</strong><em>HUD с позицией курсора</em></div><button type=\"button\" class=\"tg\" id=\"tgCoords\"></button></div>" +
        "<div class=\"row\"><div><strong>Показывать статус</strong><em>онлайн / кулдаун внизу</em></div><button type=\"button\" class=\"tg\" id=\"tgHud\"></button></div>" +
        "<div class=\"row\"><div><strong>Авто-центр</strong><em>поле по центру при загрузке</em></div><button type=\"button\" class=\"tg\" id=\"tgCenter\"></button></div>" +
        "<div class=\"row\"><div><strong>Подтверждать клик</strong><em>спросить перед пикселем</em></div><button type=\"button\" class=\"tg\" id=\"tgConfirm\"></button></div>" +
        "<div class=\"row\"><div><strong>Меньше анимаций</strong><em>щадит слабые устройства</em></div><button type=\"button\" class=\"tg\" id=\"tgMotion\"></button></div>" +
      "</div>" +
      "<p class=\"ok\" id=\"saveNote\"></p>" +
      "<p class=\"note\">Всё сохраняется в этом браузере и применяется на поле.</p>";

    bindTg("tgFx", "fx");
    bindTg("tgSound", "sound");
    bindTg("tgCoords", "showCoords");
    bindTg("tgHud", "showHud");
    bindTg("tgCenter", "autoCenter");
    bindTg("tgConfirm", "confirmPlace");
    bindTg("tgMotion", "reducedMotion");

    var rng = document.getElementById("rngVol");
    var volVal = document.getElementById("volVal");
    rng.oninput = function () {
      settings.volume = (+rng.value) / 100;
      volVal.textContent = rng.value + "%";
      saveSettings();
      flash();
    };
  }

  function renderExtra() {
    extraCard.innerHTML =
      "<h2>Ещё настройки</h2>" +
      "<div class=\"rows\">" +
        "<div class=\"row\">" +
          "<div><strong>Шаг зума</strong><em>насколько резко приближать</em></div>" +
          "<div class=\"seg\" id=\"zoomSeg\">" +
            "<button type=\"button\" data-v=\"soft\">Мягкий</button>" +
            "<button type=\"button\" data-v=\"normal\">Норм</button>" +
            "<button type=\"button\" data-v=\"fast\">Быстрый</button>" +
          "</div>" +
        "</div>" +
        "<div class=\"row\">" +
          "<div><strong>Качество эффектов</strong><em>частицы и кольца</em></div>" +
          "<div class=\"seg\" id=\"qualSeg\">" +
            "<button type=\"button\" data-v=\"low\">Лайт</button>" +
            "<button type=\"button\" data-v=\"high\">Имба</button>" +
          "</div>" +
        "</div>" +
        "<div class=\"row\">" +
          "<div><strong>Акцент интерфейса</strong><em>настроение меню</em></div>" +
          "<select id=\"accentSel\">" +
            "<option value=\"mono\">Моно</option>" +
            "<option value=\"cold\">Холод</option>" +
            "<option value=\"warm\">Тепло</option>" +
            "<option value=\"neon\">Неон</option>" +
          "</select>" +
        "</div>" +
        "<div class=\"row\">" +
          "<div><strong>Сбросить настройки</strong><em>вернуть заводские</em></div>" +
          "<button type=\"button\" class=\"btn\" id=\"btnReset\">Сброс</button>" +
        "</div>" +
      "</div>" +
      "<p class=\"note\">Предфинал: эти тумблеры уже сохраняются. Часть визуала на поле подключим в следующем патче.</p>";

    function bindSeg(id, key) {
      var box = document.getElementById(id);
      var buttons = box.querySelectorAll("button");
      buttons.forEach(function (b) {
        b.classList.toggle("on", b.dataset.v === settings[key]);
        b.onclick = function () {
          settings[key] = b.dataset.v;
          saveSettings();
          buttons.forEach(function (x) { x.classList.toggle("on", x.dataset.v === settings[key]); });
          flash();
        };
      });
    }
    bindSeg("zoomSeg", "zoomStep");
    bindSeg("qualSeg", "quality");

    var sel = document.getElementById("accentSel");
    sel.value = settings.accent || "mono";
    sel.onchange = function () {
      settings.accent = sel.value;
      saveSettings();
      flash();
    };

    document.getElementById("btnReset").onclick = function () {
      if (!confirm("Сбросить все локальные настройки?")) return;
      settings = Object.assign({}, DEFAULTS);
      saveSettings();
      renderSettings();
      renderExtra();
      flash();
    };
  }

  function render() {
    renderSettings();
    renderExtra();

    var name = me ? me.nick : "";
    var n = me && me.stats ? me.stats.n : 0;
    var day = me && me.stats ? me.stats.today : 0;
    var since = me && me.since ? new Date(me.since).toLocaleDateString("ru") : "—";

    statsCard.innerHTML =
      "<h2>Статистика</h2>" +
      "<div class=\"stats\">" +
        "<div class=\"stat\"><b>" + fmt(n) + "</b><span>всего пикселей</span></div>" +
        "<div class=\"stat\"><b>" + fmt(day) + "</b><span>сегодня</span></div>" +
        "<div class=\"stat\"><b>" + (name ? since : "—") + "</b><span>с нами с</span></div>" +
      "</div>" +
      "<p class=\"stat-foot\">" + (name
        ? "Сервер считает каждый успешный пиксель на общем поле."
        : "После входа здесь появятся твои цифры с сервера.") + "</p>";

    if (name) {
      var avStyle = me.avatar
        ? ("background-image:url(" + me.avatar + ");background-size:cover;background-position:center;")
        : ("background:" + avColor(name));
      var avText = me.avatar ? "" : ini(name);
      accountCard.innerHTML =
        "<h2>Аккаунт</h2>" +
        "<div class=\"hero\">" +
          "<div class=\"av-wrap\"><div class=\"av-ring\"></div>" +
            "<div class=\"av\" id=\"bigAv\" style=\"" + avStyle + "\">" + avText + "</div>" +
          "</div>" +
          "<div class=\"hero-meta\">" +
            "<b>" + name + "</b>" +
            "<small><span class=\"dot\"></span>в сети · серверный аккаунт</small>" +
            "<div class=\"hero-actions\">" +
              "<label class=\"btn\" style=\"display:grid;place-items:center;cursor:pointer\">Аватар<input id=\"avFile\" type=\"file\" accept=\"image/*\" hidden></label>" +
              "<a class=\"btn pri\" href=\"index.html\">На поле</a>" +
              "<button class=\"btn danger\" type=\"button\" id=\"logoutBtn\">Выйти</button>" +
            "</div>" +
          "</div>" +
        "</div>" +
        "<p class=\"note\" id=\"avNote\">Можно поставить свой аватар (как в Farside). Пиксели и ник — на сервере.</p>";
      document.getElementById("logoutBtn").onclick = async function () {
        try { await api("/api/logout", { method: "POST" }); } catch (e) {}
        token = "";
        me = null;
        localStorage.removeItem(TOKEN_KEY);
        render();
      };
      document.getElementById("avFile").onchange = function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type || file.type.indexOf("image/") !== 0) {
          document.getElementById("avNote").textContent = "Нужна картинка (jpg/png/webp)";
          return;
        }
        document.getElementById("avNote").textContent = "Загрузка аватара...";
        var reader = new FileReader();
        reader.onerror = function () {
          document.getElementById("avNote").textContent = "Не удалось прочитать файл";
        };
        reader.onload = function () {
          var img = new Image();
          img.onerror = function () {
            document.getElementById("avNote").textContent = "Битая картинка";
          };
          img.onload = async function () {
            try {
              var c = document.createElement("canvas");
              var size = 128;
              c.width = size; c.height = size;
              var g = c.getContext("2d");
              var side = Math.min(img.width, img.height) || 1;
              var sx = (img.width - side) / 2;
              var sy = (img.height - side) / 2;
              g.fillStyle = "#222";
              g.fillRect(0, 0, size, size);
              g.drawImage(img, sx, sy, side, side, 0, 0, size, size);
              var dataUrl = c.toDataURL("image/jpeg", 0.82);
              var data = await api("/api/avatar", { method: "POST", body: { avatar: dataUrl } });
              me = data.user;
              render();
            } catch (err) {
              document.getElementById("avNote").textContent = (err && err.message) || "Сервер не принял аватар. Залей server.js заново.";
            }
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      };
      return;
    }

    accountCard.innerHTML =
      "<h2>Аккаунт</h2>" +
      "<div class=\"hero\" style=\"margin-bottom:16px\">" +
        "<div class=\"av-wrap\"><div class=\"av-ring\"></div>" +
          "<div class=\"av\" style=\"background:#3a3a42\">?</div>" +
        "</div>" +
        "<div class=\"hero-meta\">" +
          "<b>Гость</b>" +
          "<small>войди, чтобы ставить пиксели на общем поле</small>" +
        "</div>" +
      "</div>" +
      "<div class=\"tabs\">" +
        "<button type=\"button\" class=\"on\" id=\"tabLogin\">Вход</button>" +
        "<button type=\"button\" id=\"tabReg\">Регистрация</button>" +
      "</div>" +
      "<form id=\"authForm\" autocomplete=\"off\">" +
        "<label>Ник<input id=\"authNick\" name=\"pb_nick_x\" maxlength=\"16\" autocomplete=\"off\" required value=\"\"></label>" +
        "<label>Пароль<input id=\"authPass\" name=\"pb_pass_x\" type=\"password\" minlength=\"4\" autocomplete=\"new-password\" required value=\"\"></label>" +
        "<p class=\"err\" id=\"authErr\"></p>" +
        "<button class=\"btn pri\" type=\"submit\" id=\"authSubmit\" style=\"width:100%\">Войти</button>" +
      "</form>" +
      "<p class=\"note\">Без аккаунта пиксели не ставятся. Данные на сервере Render.</p>";

    setTimeout(function () {
      var nEl = document.getElementById("authNick");
      var pEl = document.getElementById("authPass");
      if (nEl) nEl.value = "";
      if (pEl) pEl.value = "";
    }, 0);

    var mode = "login";
    document.getElementById("tabLogin").onclick = function () {
      mode = "login";
      this.classList.add("on");
      document.getElementById("tabReg").classList.remove("on");
      document.getElementById("authSubmit").textContent = "Войти";
      document.getElementById("authErr").textContent = "";
    };
    document.getElementById("tabReg").onclick = function () {
      mode = "register";
      this.classList.add("on");
      document.getElementById("tabLogin").classList.remove("on");
      document.getElementById("authSubmit").textContent = "Создать аккаунт";
      document.getElementById("authErr").textContent = "";
    };
    document.getElementById("authForm").onsubmit = async function (e) {
      e.preventDefault();
      var nickVal = document.getElementById("authNick").value;
      var passVal = document.getElementById("authPass").value;
      try {
        var data = await api(mode === "login" ? "/api/login" : "/api/register", {
          method: "POST",
          body: { nick: nickVal, pass: passVal }
        });
        token = data.token;
        me = data.user;
        localStorage.setItem(TOKEN_KEY, token);
        render();
      } catch (err) {
        document.getElementById("authErr").textContent = err.message || "Ошибка";
      }
    };
  }

  async function boot() {
    if (token) {
      try {
        var data = await api("/api/me");
        me = data.user;
      } catch (e) {
        token = "";
        me = null;
        localStorage.removeItem(TOKEN_KEY);
      }
    }
    render();
  }
  boot();
})();
</script>
</body>
</html>
