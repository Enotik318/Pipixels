<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Профиль — Pixel Battle</title>
<style>
  :root {
    --bg: #050506;
    --ink: #f5f5f7;
    --mute: #8b8b96;
    --line: rgba(255,255,255,.1);
    --card: rgba(255,255,255,.035);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    color: var(--ink);
    background: #000;
    font: 14px/1.45 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  .page {
    min-height: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 48px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 200px;
    gap: 28px;
    align-items: start;
  }
  .main { min-width: 0; }
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }
  .brand { font-weight: 700; font-size: 24px; letter-spacing: -.04em; }
  .brand span {
    display: block; margin-top: 5px; color: var(--mute);
    font-size: 12px; font-weight: 500;
  }
  .btn {
    height: 40px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: rgba(255,255,255,.03);
  }
  .btn:hover { background: rgba(255,255,255,.07); }
  .btn.pri {
    background: #fff; color: #111; border-color: #fff; font-weight: 600;
  }
  .stack { display: grid; gap: 16px; }
  .card {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), transparent 40%), var(--card);
    padding: 20px;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(600px 180px at 10% -10%, rgba(255,255,255,.07), transparent 60%);
  }
  .card > * { position: relative; }
  .card h2 {
    margin: 0 0 16px;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--mute); font-weight: 650;
  }
  .hero {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 18px;
    align-items: center;
  }
  .av-wrap { position: relative; width: 92px; height: 92px; }
  .av-ring {
    position: absolute; inset: -4px; border-radius: 50%;
    background: conic-gradient(from 180deg, #fff, #666, #fff, #999, #fff);
    opacity: .55;
  }
  .av {
    position: relative; width: 92px; height: 92px; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
    font-weight: 700; font-size: 34px; letter-spacing: -.03em;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 12px 30px rgba(0,0,0,.4);
  }
  .hero-meta b {
    display: block; font-size: 26px; letter-spacing: -.03em; margin-bottom: 4px;
  }
  .hero-meta small {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--mute); font-size: 12px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #3dd68c;
    box-shadow: 0 0 0 3px rgba(61,214,140,.15);
  }
  .hero-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat {
    position: relative; padding: 16px; border-radius: 16px;
    border: 1px solid var(--line); background: rgba(0,0,0,.28); overflow: hidden;
  }
  .stat::after {
    content: ""; position: absolute; right: -20px; top: -20px;
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
  }
  .stat b {
    display: block; font-size: 28px; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; margin-bottom: 4px;
  }
  .stat span { color: var(--mute); font-size: 12px; }
  .stat-foot { margin-top: 14px; color: var(--mute); font-size: 12px; line-height: 1.45; }
  .rows { display: grid; gap: 8px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(0,0,0,.22);
  }
  .row strong { display: block; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .row em { display: block; font-style: normal; color: var(--mute); font-size: 12px; }
  .tg {
    position: relative; width: 50px; height: 30px; border: 0; border-radius: 999px;
    background: #2a2a31; padding: 0; flex: none; transition: background .15s;
  }
  .tg::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); transition: transform .18s ease;
  }
  .tg.on { background: #fff; }
  .tg.on::after { transform: translateX(20px); background: #111; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button {
    height: 36px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent;
  }
  .tabs button.on { background: #fff; color: #111; border-color: #fff; font-weight: 600; }
  label {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 12px; color: var(--mute); font-size: 12px;
  }
  label input {
    height: 46px; padding: 0 14px; border: 1px solid var(--line);
    border-radius: 14px; background: rgba(0,0,0,.35);
  }
  label input:focus { outline: none; border-color: rgba(255,255,255,.28); }
  .err { min-height: 18px; color: #ff6b6b; font-size: 13px; margin: 0 0 8px; }
  .note { color: var(--mute); font-size: 12px; line-height: 1.45; margin: 12px 0 0; }
  .rail { position: sticky; top: 28px; }
  .rail-label {
    margin: 0 0 10px; color: var(--mute); font-size: 11px;
    font-weight: 650; letter-spacing: .1em; text-transform: uppercase;
  }
  .can {
    width: 100%; max-width: 180px; margin-left: auto;
    border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.12); background: #000;
    aspect-ratio: 3 / 4.2;
    box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 18px 40px rgba(0,0,0,.55);
  }
  #bgVideo {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: saturate(.95) contrast(1.06);
  }
  .rail-cap {
    max-width: 180px; margin: 10px 0 0 auto;
    color: var(--mute); font-size: 12px; line-height: 1.4; text-align: right;
  }
  @media (max-width: 820px) {
    .page { grid-template-columns: 1fr; max-width: 560px; }
    .rail {
      position: relative; top: 0; order: -1;
      display: flex; align-items: center; gap: 14px;
    }
    .can { width: 110px; margin: 0; }
    .rail-cap { margin: 0; text-align: left; max-width: none; }
    .rail-label { display: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="main">
      <div class="top">
        <div class="brand">
          pixel battle
          <span>профиль · аккаунт на сервере</span>
        </div>
        <a class="btn" href="index.html">К полю</a>
      </div>
      <div class="stack">
        <section class="card" id="accountCard"></section>
        <section class="card" id="statsCard"></section>
        <section class="card" id="settingsCard"></section>
      </div>
    </div>
    <aside class="rail">
      <div class="rail-label">Loop</div>
      <div class="can">
        <video id="bgVideo" autoplay muted loop playsinline>
          <source src="media/can.mp4" type="video/mp4" />
        </video>
      </div>
      <div class="rail-cap">маленький loop справа</div>
    </aside>
  </div>

<script>
(function () {
  "use strict";
  const TOKEN_KEY = "pixelbattle.token.v1";
  const SETTINGS_KEY = "pixelbattle.settings.v1";
  const API = "https://pipixels.onrender.com";

  function loadJSON(k, f) {
    try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch (e) { return f; }
  }
  function saveJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
  function fmt(n) { return Number(n).toLocaleString("ru"); }
  function ini(n) { return n ? Array.from(n)[0].toUpperCase() : "?"; }
  function avColor(n) {
    if (!n) return "#3a3a42";
    var h = 0;
    for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360;
    return "hsl(" + h + " 58% 42%)";
  }

  var token = localStorage.getItem(TOKEN_KEY) || "";
  var me = null;
  var settings = Object.assign({ fx: true, sound: true }, loadJSON(SETTINGS_KEY, {}));
  if (typeof settings.sound !== "boolean") settings.sound = true;
  if (typeof settings.fx !== "boolean") settings.fx = true;

  async function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (token) headers.Authorization = "Bearer " + token;
    var res = await fetch(API + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) {
      var err = new Error((data && data.error) || ("Ошибка " + res.status));
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  var accountCard = document.getElementById("accountCard");
  var statsCard = document.getElementById("statsCard");
  var settingsCard = document.getElementById("settingsCard");
  var video = document.getElementById("bgVideo");
  video.muted = true;
  video.play().catch(function () {});

  function saveSettings() { saveJSON(SETTINGS_KEY, settings); }

  function renderSettings() {
    settingsCard.innerHTML =
      "<h2>Настройки</h2>" +
      "<div class=\"rows\">" +
        "<div class=\"row\">" +
          "<div><strong>Анимация куба</strong><em>вспышка и кольцо при постановке</em></div>" +
          "<button type=\"button\" class=\"tg\" id=\"tgFx\"></button>" +
        "</div>" +
        "<div class=\"row\">" +
          "<div><strong>Звук</strong><em>мягкий клик при каждом пикселе</em></div>" +
          "<button type=\"button\" class=\"tg\" id=\"tgSound\"></button>" +
        "</div>" +
      "</div>" +
      "<p class=\"note\">Локальные настройки этого браузера.</p>";
    var fx = document.getElementById("tgFx");
    var sound = document.getElementById("tgSound");
    fx.classList.toggle("on", !!settings.fx);
    sound.classList.toggle("on", !!settings.sound);
    fx.onclick = function () { settings.fx = !settings.fx; saveSettings(); fx.classList.toggle("on", settings.fx); };
    sound.onclick = function () { settings.sound = !settings.sound; saveSettings(); sound.classList.toggle("on", settings.sound); };
  }

  function render() {
    renderSettings();
    var name = me ? me.nick : "";
    var n = me && me.stats ? me.stats.n : 0;
    var day = me && me.stats ? me.stats.today : 0;

    statsCard.innerHTML =
      "<h2>Статистика</h2>" +
      "<div class=\"stats\">" +
        "<div class=\"stat\"><b>" + fmt(n || 0) + "</b><span>всего пикселей</span></div>" +
        "<div class=\"stat\"><b>" + fmt(day || 0) + "</b><span>сегодня</span></div>" +
      "</div>" +
      "<p class=\"stat-foot\">" + (name
        ? "Сервер считает каждый успешный пиксель."
        : "После входа здесь появятся твои цифры с сервера.") + "</p>";

    if (name) {
      accountCard.innerHTML =
        "<h2>Аккаунт</h2>" +
        "<div class=\"hero\">" +
          "<div class=\"av-wrap\"><div class=\"av-ring\"></div>" +
            "<div class=\"av\" style=\"background:" + avColor(name) + "\">" + ini(name) + "</div>" +
          "</div>" +
          "<div class=\"hero-meta\">" +
            "<b>" + name + "</b>" +
            "<small><span class=\"dot\"></span>в сети · серверный аккаунт</small>" +
            "<div class=\"hero-actions\">" +
              "<button class=\"btn\" type=\"button\" id=\"logoutBtn\">Выйти</button>" +
            "</div>" +
          "</div>" +
        "</div>" +
        "<p class=\"note\">Токен хранится в браузере. Пиксели — на сервере у всех.</p>";
      document.getElementById("logoutBtn").onclick = async function () {
        try { await api("/api/logout", { method: "POST" }); } catch (e) {}
        token = "";
        me = null;
        localStorage.removeItem(TOKEN_KEY);
        render();
      };
      return;
    }

    accountCard.innerHTML =
      "<h2>Аккаунт</h2>" +
      "<div class=\"hero\" style=\"margin-bottom:16px\">" +
        "<div class=\"av-wrap\"><div class=\"av-ring\"></div>" +
          "<div class=\"av\" style=\"background:#3a3a42\">?</div>" +
        "</div>" +
        "<div class=\"hero-meta\">" +
          "<b>Гость</b>" +
          "<small>войди, чтобы ставить пиксели</small>" +
        "</div>" +
      "</div>" +
      "<div class=\"tabs\">" +
        "<button type=\"button\" class=\"on\" id=\"tabLogin\">Вход</button>" +
        "<button type=\"button\" id=\"tabReg\">Регистрация</button>" +
      "</div>" +
      "<form id=\"authForm\" autocomplete=\"off\">" +
        "<label>Ник<input id=\"authNick\" name=\"pb_nick_x\" maxlength=\"16\" autocomplete=\"off\" required value=\"\"></label>" +
        "<label>Пароль<input id=\"authPass\" name=\"pb_pass_x\" type=\"password\" minlength=\"4\" autocomplete=\"new-password\" required value=\"\"></label>" +
        "<p class=\"err\" id=\"authErr\"></p>" +
        "<button class=\"btn pri\" type=\"submit\" id=\"authSubmit\" style=\"width:100%\">Войти</button>" +
      "</form>" +
      "<p class=\"note\">Поля пустые. Аккаунт создаётся на сервере.</p>";

    setTimeout(function () {
      var nEl = document.getElementById("authNick");
      var pEl = document.getElementById("authPass");
      if (nEl) nEl.value = "";
      if (pEl) pEl.value = "";
    }, 0);

    var mode = "login";
    document.getElementById("tabLogin").onclick = function () {
      mode = "login";
      this.classList.add("on");
      document.getElementById("tabReg").classList.remove("on");
      document.getElementById("authSubmit").textContent = "Войти";
      document.getElementById("authErr").textContent = "";
    };
    document.getElementById("tabReg").onclick = function () {
      mode = "register";
      this.classList.add("on");
      document.getElementById("tabLogin").classList.remove("on");
      document.getElementById("authSubmit").textContent = "Создать аккаунт";
      document.getElementById("authErr").textContent = "";
    };
    document.getElementById("authForm").onsubmit = async function (e) {
      e.preventDefault();
      var nickVal = document.getElementById("authNick").value;
      var passVal = document.getElementById("authPass").value;
      try {
        var data = await api(mode === "login" ? "/api/login" : "/api/register", {
          method: "POST",
          body: { nick: nickVal, pass: passVal }
        });
        token = data.token;
        me = data.user;
        localStorage.setItem(TOKEN_KEY, token);
        render();
      } catch (err) {
        document.getElementById("authErr").textContent = err.message || "Ошибка";
      }
    };
  }

  async function boot() {
    if (token) {
      try {
        var data = await api("/api/me");
        me = data.user;
      } catch (e) {
        token = "";
        me = null;
        localStorage.removeItem(TOKEN_KEY);
      }
    }
    render();
  }
  boot();
})();
</script>
</body>
</html>
