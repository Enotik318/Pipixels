<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pixel Battle — общее поле 250×250</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="description" content="Общее пиксельное поле. Регистрируйся и рисуй вместе со всеми." />
<meta property="og:title" content="Pixel Battle" />
<meta property="og:description" content="Общее поле 250×250. Заходи и ставь пиксели." />
<style>
  :root {
    --bg: #08080a;
    --ink: #f3f3f5;
    --mute: #8a8a96;
    --line: rgba(255,255,255,.09);
    --soft: rgba(255,255,255,.045);
    --panel: rgba(18,18,22,.94);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  #view {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    touch-action: none;
    cursor: crosshair;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,255,255,.05), transparent 55%),
      var(--bg);
  }
  #stage {
    position: absolute;
    left: 0; top: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  .board { position: relative; }
  .board-inner {
    position: relative;
    background: #fff;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.04),
      0 18px 50px rgba(0,0,0,.35);
  }
  .board-inner::after {
    content: "";
    position: absolute;
    inset: -24px;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(8,8,10,.35) 78%, rgba(8,8,10,.85) 100%);
  }
  #cv {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #fff;
    position: relative;
    z-index: 1;
  }
  #gridCv {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }
  .fx { position: absolute; pointer-events: none; z-index: 5; }
  #hud, #status, #zoom {
    border: 1px solid var(--line);
    background: rgba(14,14,18,.82);
    backdrop-filter: blur(12px);
  }
  #hud {
    position: absolute; left: 14px; top: 14px;
    padding: 8px 12px; border-radius: 12px;
    color: var(--mute); pointer-events: none;
    font-variant-numeric: tabular-nums; font-size: 13px;
  }
  #status {
    position: absolute; left: 14px; bottom: 14px;
    padding: 8px 12px; border-radius: 12px;
    color: var(--mute); font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .sdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #f5a623; flex: none;
  }
  .sdot.ok { background: #3dd68c; box-shadow: 0 0 0 3px rgba(61,214,140,.15); }
  .sdot.err { background: #ff6b6b; }
  #zoom {
    position: absolute; right: 14px; top: 14px;
    display: flex; align-items: center;
    border-radius: 12px; overflow: hidden;
    z-index: 6;
  }
  #zoom button {
    width: 40px; height: 40px; border: 0;
    background: transparent; font-size: 18px;
  }
  #zoom button:hover { background: var(--soft); }
  #zoom span {
    min-width: 56px; text-align: center;
    color: var(--mute); font-size: 13px;
  }

  #side {
    width: 320px;
    margin: 14px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.05), transparent 28%),
      var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 16px; border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 700; font-size: 17px; letter-spacing: -.04em; }
  .logo small {
    display: block; margin-top: 3px; color: var(--mute);
    font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
  }
  .ib {
    width: 42px; height: 42px;
    border: 1px solid var(--line); border-radius: 13px;
    background: rgba(255,255,255,.03);
    display: grid; place-items: center; padding: 0; overflow: hidden;
  }
  .ib:hover { background: rgba(255,255,255,.07); }
  .av {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    color: #fff; font-size: 12px; font-weight: 700;
    background-color: #555;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.12);
  }
  .body { flex: 1; overflow: auto; }
  section { padding: 16px; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: 0; }
  h2 {
    margin: 0 0 12px; color: var(--mute);
    font-size: 11px; font-weight: 650;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .user-card {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border: 1px solid var(--line); border-radius: 16px;
    background: linear-gradient(135deg, rgba(255,255,255,.06), transparent 50%), rgba(0,0,0,.22);
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .user-card:hover {
    border-color: rgba(255,255,255,.22);
    background: linear-gradient(135deg, rgba(255,255,255,.09), transparent 50%), rgba(0,0,0,.28);
  }
  .user-card .av { width: 44px; height: 44px; font-size: 16px; flex: none; }
  .user-card-info { min-width: 0; flex: 1; }
  .user-card b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-card span { color: var(--mute); font-size: 12px; }
  .auth-quick-btn {
    padding: 6px 10px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.18);
    background: #fff; color: #111; font-size: 12px; font-weight: 600;
    flex: none;
  }

  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 12px; }
  .sw {
    aspect-ratio: 1; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.14); padding: 0;
  }
  .sw.on { outline: 2px solid #fff; outline-offset: 2px; }
  .svwrap {
    position: relative; height: 140px; border-radius: 14px;
    overflow: hidden; cursor: crosshair; touch-action: none;
    margin-bottom: 10px; border: 1px solid var(--line);
  }
  .svwrap canvas { width: 100%; height: 100%; display: block; }
  .knob {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.45); pointer-events: none;
  }
  .hue {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 12px; border-radius: 99px; margin: 0;
    background: linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  }
  .hue::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; border: 0;
  }
  .hex-row { display: flex; gap: 8px; margin-top: 12px; }
  .chip { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.15); flex: none; }
  .hex {
    flex: 1; height: 38px; border: 1px solid var(--line);
    border-radius: 10px; background: rgba(0,0,0,.25); padding: 0 12px;
  }
  .bar { height: 7px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.08); }
  .bar i { display: block; width: 100%; height: 100%; background: #fff; transform-origin: left center; }
  #cdt { margin: 10px 0 0; color: var(--mute); font-size: 12px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat {
    padding: 14px; border: 1px solid var(--line);
    border-radius: 14px; background: rgba(0,0,0,.22);
  }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--mute); font-size: 11px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tools button.on { background: #fff; color: #111; border-color: #fff; }
  .tools button {
    height: 40px; border: 1px solid var(--line);
    border-radius: 12px; background: rgba(255,255,255,.03);
  }
  .tools button:hover { background: rgba(255,255,255,.07); }

  /* Модальное окно входа/регистрации прямо на поле */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(8px);
    display: none; place-items: center; padding: 16px;
    user-select: text;
  }
  .modal-backdrop.open { display: grid; }
  .modal-card {
    width: 100%; max-width: 380px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: #121216;
    padding: 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,.65);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-head b { font-size: 18px; letter-spacing: -.03em; }
  .modal-close {
    width: 32px; height: 32px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(255,255,255,.04);
    font-size: 16px;
  }
  .modal-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .modal-tabs button {
    flex: 1; height: 36px; border-radius: 11px;
    border: 1px solid var(--line); background: transparent;
  }
  .modal-tabs button.on { background: #fff; color: #111; border-color: #fff; font-weight: 600; }
  .mfield { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; color: var(--mute); font-size: 12px; }
  .mfield input {
    height: 44px; padding: 0 14px; border: 1px solid var(--line);
    border-radius: 12px; background: rgba(0,0,0,.4);
  }
  .mfield input:focus { outline: none; border-color: rgba(255,255,255,.32); }
  .merr { min-height: 18px; color: #ff6b6b; font-size: 12px; margin: 0 0 10px; }
  .msubmit {
    width: 100%; height: 44px; border-radius: 12px; border: 0;
    background: #fff; color: #111; font-weight: 600;
  }
  .msubmit:disabled { opacity: .55; cursor: wait; }
  .mnote { margin: 12px 0 0; color: var(--mute); font-size: 12px; line-height: 1.4; }

  @media (max-width: 720px) {
    body { flex-direction: column; }
    #side { width: auto; max-height: 46vh; margin: 0 10px 10px; }
  }
</style>
</head>
<body>
  <main id="view">
    <div id="stage">
      <div class="board">
        <div class="board-inner">
          <canvas id="cv" width="250" height="250"></canvas>
          <canvas id="gridCv"></canvas>
        </div>
      </div>
    </div>
    <div id="hud">—</div>
    <div id="status"><span class="sdot" id="sdot"></span><span id="stext">подключение к серверу...</span></div>
    <div id="zoom">
      <button type="button" id="zout" title="Отдалить">−</button>
      <span id="zl">100%</span>
      <button type="button" id="zin" title="Приблизить">+</button>
    </div>
  </main>

  <aside id="side">
    <div class="head">
      <div class="logo">pixel battle<small id="logoSub">250×250 · онлайн</small></div>
      <a class="ib" href="profile.html" title="Профиль и настройки"><span class="av" id="avatar">?</span></a>
    </div>
    <div class="body">
      <section>
        <div class="user-card" id="userCard" role="button" tabindex="0">
          <span class="av" id="sideAv">?</span>
          <div class="user-card-info">
            <b id="sideName">Гость</b>
            <span id="sideSub">войти, чтобы рисовать</span>
          </div>
          <span class="auth-quick-btn" id="authQuickBtn">Войти</span>
        </div>
      </section>
      <section>
        <h2>Цвет</h2>
        <div class="svwrap" id="svwrap">
          <canvas id="sv" width="256" height="140"></canvas>
          <div class="knob" id="knob"></div>
        </div>
        <input class="hue" id="hue" type="range" min="0" max="359" value="0" />
        <div class="swatches" id="swatches"></div>
        <div class="hex-row">
          <span class="chip" id="chip"></span>
          <input class="hex" id="hex" maxlength="7" value="#111111" />
        </div>
      </section>
      <section>
        <h2>Стамина</h2>
        <div class="bar"><i id="cdbar"></i></div>
        <p id="cdt">—</p>
        <div class="stats" style="margin-top:10px">
          <div class="stat"><b id="lvl">1</b><span>уровень</span></div>
          <div class="stat"><b id="stam">30/30</b><span>стамина</span></div>
        </div>
      </section>
      <section>
        <h2>Поле</h2>
        <div class="stats">
          <div class="stat"><b id="painted">0</b><span>закрашено</span></div>
          <div class="stat"><b id="fill">0%</b><span>от поля</span></div>
        </div>
      </section>
      <section>
        <div class="tools">
          <button type="button" id="btnCenter">Центр</button>
          <button type="button" id="btnGrid">Сетка</button>
          <button type="button" id="btnPng">PNG</button>
          <button type="button" id="btnShare">Ссылка</button>
        </div>
      </section>
    </div>
  </aside>

  <!-- Модальное окно авторизации -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal-card">
      <div class="modal-head">
        <b>Аккаунт Pixel Battle</b>
        <button type="button" class="modal-close" id="closeAuthModal">✕</button>
      </div>
      <div class="modal-tabs">
        <button type="button" class="on" id="mTabLogin">Вход</button>
        <button type="button" id="mTabReg">Регистрация</button>
      </div>
      <form id="mAuthForm">
        <label class="mfield">
          Ник (3–16 символов)
          <input id="mNick" maxlength="16" autocomplete="username" required />
        </label>
        <label class="mfield">
          Пароль (от 4 символов)
          <input id="mPass" type="password" minlength="4" autocomplete="current-password" required />
        </label>
        <p class="merr" id="mErr"></p>
        <button type="submit" class="msubmit" id="mSubmit">Войти</button>
      </form>
      <p class="mnote">После входа можно сразу ставить пиксели на общем поле. <a href="profile.html" style="text-decoration:underline">Открыть полный профиль →</a></p>
    </div>
  </div>

<script>
(function () {
  "use strict";

  const W = 250;
  const H = 250;
  const COOLDOWN = 1200;
  const TOKEN_KEY = "pixelbattle.token.v1";
  const SETTINGS_KEY = "pixelbattle.settings.v1";
  const API = "https://pipixels.onrender.com";

  const COLORS = [
    "#111111","#ffffff","#ff3b4e","#ffc62e",
    "#2dce89","#38a3ff","#9d4edd","#c98a5b",
    "#7a4a2e","#1e3a4c","#a5e04a","#19c3c9",
    "#2557e8","#cdb4ff","#ff8fb1","#f6e58d"
  ];

  function loadJSON(k, f) {
    try {
      var r = localStorage.getItem(k);
      return r ? JSON.parse(r) : f;
    } catch (e) {
      return f;
    }
  }

  function fmt(n) {
    return Number(n).toLocaleString("ru");
  }

  function ini(n) {
    return n ? Array.from(n)[0].toUpperCase() : "?";
  }

  function avColor(n) {
    if (!n) return "#555";
    var h = 0;
    for (var i = 0; i < n.length; i++) {
      h = (h * 31 + n.charCodeAt(i)) % 360;
    }
    return "hsl(" + h + " 55% 45%)";
  }

  function hsvToHex(h, s, v) {
    var f = function (n) {
      var k = (n + h / 60) % 6;
      return v - v * s * Math.max(0, Math.min(k, 4 - k, 1));
    };
    return "#" + [f(5), f(3), f(1)].map(function (x) {
      return Math.round(x * 255).toString(16).padStart(2, "0");
    }).join("");
  }

  function hexToHsv(c) {
    var n = parseInt(c.slice(1), 16);
    var r = ((n >> 16) & 255) / 255;
    var g = ((n >> 8) & 255) / 255;
    var b = (n & 255) / 255;
    var mx = Math.max(r, g, b);
    var d = mx - Math.min(r, g, b);
    var h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d + 6) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, mx ? d / mx : 0, mx];
  }

  var token = localStorage.getItem(TOKEN_KEY) || "";
  var me = null;
  var serverReady = false;

  var settings = Object.assign({
    fx: true,
    sound: true,
    volume: 0.6,
    showHud: true,
    showCoords: true,
    showGrid: true,
    reducedMotion: false,
    confirmPlace: false
  }, loadJSON(SETTINGS_KEY, {}));

  var pixels = {};
  var lastOnline = 0;
  var color = "#111111";
  var HH = 0, SS = 0, VV = 0.07;
  var lastPlace = 0;
  var camX = 0, camY = 0, scale = 1;
  var placing = false;

  var view = document.getElementById("view");
  var stage = document.getElementById("stage");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var gridCv = document.getElementById("gridCv");
  var gridCtx = gridCv.getContext("2d");
  var hud = document.getElementById("hud");
  var statusEl = document.getElementById("status");
  var stext = document.getElementById("stext");
  var sdot = document.getElementById("sdot");
  var zl = document.getElementById("zl");
  var cdbar = document.getElementById("cdbar");
  var cdt = document.getElementById("cdt");
  var paintedEl = document.getElementById("painted");
  var fillEl = document.getElementById("fill");
  var swatches = document.getElementById("swatches");
  var chip = document.getElementById("chip");
  var hexInput = document.getElementById("hex");
  var sv = document.getElementById("sv");
  var svg = sv.getContext("2d");
  var knob = document.getElementById("knob");
  var hueEl = document.getElementById("hue");
  var svwrap = document.getElementById("svwrap");

  function setStatus(text, state) {
    stext.textContent = text;
    sdot.className = "sdot" + (state ? " " + state : "");
  }

  async function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({
      "Content-Type": "application/json"
    }, opts.headers || {});

    if (token) {
      headers.Authorization = "Bearer " + token;
    }

    var controller = new AbortController();
    var timeoutMs = opts.timeout || 25000;
    var timer = setTimeout(function () {
      controller.abort();
    }, timeoutMs);

    try {
      var res = await fetch(API + path, {
        cache: "no-store",
        method: opts.method || "GET",
        headers: headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
        signal: controller.signal
      });

      var data = null;
      try {
        data = await res.json();
      } catch (e) {
        data = null;
      }

      if (!res.ok) {
        var err = new Error((data && data.error) || ("Ошибка сервера (" + res.status + ")"));
        err.status = res.status;
        err.data = data;
        throw err;
      }

      serverReady = true;
      return data;
    } catch (e) {
      if (e.name === "AbortError") {
        throw new Error("Сервер долго просыпается, попробуйте ещё раз");
      }
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  function setAvatarEl(el, name, avatarUrl) {
    if (!el) return;
    if (avatarUrl) {
      el.textContent = "";
      el.style.backgroundImage = "url(" + avatarUrl + ")";
      el.style.backgroundColor = "transparent";
    } else {
      el.style.backgroundImage = "";
      el.textContent = ini(name);
      el.style.backgroundColor = avColor(name);
    }
  }

  function applyUiSettings() {
    statusEl.style.display = settings.showHud === false ? "none" : "";
    hud.style.display = settings.showCoords === false ? "none" : "";
  }

  function updateProgressUI() {
    var prog = me && me.progress ? me.progress : null;
    var lvlEl = document.getElementById("lvl");
    var stamEl = document.getElementById("stam");

    if (!prog) {
      if (lvlEl) lvlEl.textContent = "—";
      if (stamEl) stamEl.textContent = "—";
      cdbar.style.transform = "scaleX(0)";
      cdt.textContent = me ? "…" : "войди, чтобы рисовать";
      return;
    }

    if (lvlEl) lvlEl.textContent = String(prog.level || 1);
    if (stamEl) {
      stamEl.textContent = (prog.stamina || 0) + "/" + (prog.staminaMax || 30);
    }

    var ratio = prog.staminaMax ? (prog.stamina / prog.staminaMax) : 0;
    cdbar.style.transform = "scaleX(" + Math.max(0, Math.min(1, ratio)) + ")";

    if (prog.stamina >= 1) {
      cdt.textContent = "Можно ставить";
    } else {
      cdt.textContent = "Восстановление " + Math.ceil((prog.nextIn || 0) / 1000) + " с";
    }
  }

  function refreshUserUI() {
    var name = me ? me.nick : "";
    var av = me && me.avatar ? me.avatar : "";
    var qBtn = document.getElementById("authQuickBtn");

    setAvatarEl(document.getElementById("avatar"), name, av);
    setAvatarEl(document.getElementById("sideAv"), name, av);

    document.getElementById("sideName").textContent = name || "Гость";
    document.getElementById("sideSub").textContent = name ? "профиль и настройки →" : "нажми, чтобы войти";
    if (qBtn) {
      qBtn.style.display = name ? "none" : "";
    }

    applyUiSettings();
    updateProgressUI();
  }

  /* Модальное окно входа/регистрации */
  var authModal = document.getElementById("authModal");
  var mMode = "login";
  var pendingPixel = null;

  function openAuthModal(defaultMode, pixelCoords) {
    pendingPixel = pixelCoords || null;
    mMode = defaultMode || "login";
    document.getElementById("mTabLogin").classList.toggle("on", mMode === "login");
    document.getElementById("mTabReg").classList.toggle("on", mMode === "register");
    document.getElementById("mSubmit").textContent = mMode === "login" ? "Войти" : "Создать аккаунт";
    document.getElementById("mPass").autocomplete = mMode === "login" ? "current-password" : "new-password";
    document.getElementById("mErr").textContent = "";
    authModal.classList.add("open");
    setTimeout(function () {
      document.getElementById("mNick").focus();
    }, 30);
  }

  function closeAuthModal() {
    authModal.classList.remove("open");
    pendingPixel = null;
  }

  document.getElementById("closeAuthModal").onclick = closeAuthModal;
  authModal.addEventListener("click", function (e) {
    if (e.target === authModal) closeAuthModal();
  });

  document.getElementById("mTabLogin").onclick = function () {
    openAuthModal("login", pendingPixel);
  };
  document.getElementById("mTabReg").onclick = function () {
    openAuthModal("register", pendingPixel);
  };

  document.getElementById("userCard").onclick = function () {
    if (me) {
      location.href = "profile.html";
    } else {
      openAuthModal("login");
    }
  };

  document.getElementById("mAuthForm").onsubmit = async function (e) {
    e.preventDefault();
    var nickVal = document.getElementById("mNick").value.trim();
    var passVal = document.getElementById("mPass").value;
    var errEl = document.getElementById("mErr");
    var subBtn = document.getElementById("mSubmit");

    errEl.textContent = "";
    subBtn.disabled = true;
    subBtn.textContent = serverReady ? "Загрузка..." : "Будим сервер и входим...";

    try {
      var data = await api(mMode === "login" ? "/api/login" : "/api/register", {
        method: "POST",
        body: { nick: nickVal, pass: passVal },
        timeout: 45000
      });

      token = data.token;
      me = data.user;
      if (me && me.progress) me.progress._localAt = Date.now();
      localStorage.setItem(TOKEN_KEY, token);

      refreshUserUI();
      setStatus("онлайн · " + me.nick, "ok");

      var toPaint = pendingPixel;
      closeAuthModal();

      // Обновляем актуальное состояние холста и ставим отложенный пиксель
      refreshCanvas();
      if (toPaint) {
        place(toPaint[0], toPaint[1]);
      }
    } catch (err) {
      errEl.textContent = err.message || "Не удалось войти";
    } finally {
      subBtn.disabled = false;
      subBtn.textContent = mMode === "login" ? "Войти" : "Создать аккаунт";
    }
  };

  function drawGrid() {
    var dpr = window.devicePixelRatio || 1;
    var cellPx = scale * dpr;
    var gw = Math.max(1, Math.round(W * cellPx));
    var gh = Math.max(1, Math.round(H * cellPx));

    if (gridCv.width !== gw || gridCv.height !== gh) {
      gridCv.width = gw;
      gridCv.height = gh;
    }

    gridCtx.clearRect(0, 0, gw, gh);
    if (!settings.showGrid || scale < 4) return;

    var alpha = Math.min(0.22, (scale - 3) * 0.025);
    gridCtx.strokeStyle = "rgba(0, 0, 0, " + alpha.toFixed(3) + ")";
    gridCtx.lineWidth = 1;
    gridCtx.beginPath();

    for (var x = 1; x < W; x++) {
      var px = Math.round(x * cellPx) + 0.5;
      gridCtx.moveTo(px, 0);
      gridCtx.lineTo(px, gh);
    }
    for (var y = 1; y < H; y++) {
      var py = Math.round(y * cellPx) + 0.5;
      gridCtx.moveTo(0, py);
      gridCtx.lineTo(gw, py);
    }
    gridCtx.stroke();
  }

  function redraw() {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);

    var keys = Object.keys(pixels);
    for (var i = 0; i < keys.length; i++) {
      var parts = keys[i].split(",");
      var cell = pixels[keys[i]];
      ctx.fillStyle = (cell && cell.color) ? cell.color : cell;
      ctx.fillRect(+parts[0], +parts[1], 1, 1);
    }

    paintedEl.textContent = fmt(keys.length);
    fillEl.textContent = ((keys.length / (W * H)) * 100).toFixed(2).replace(".", ",") + "%";

    var onlineEl = document.getElementById("logoSub");
    if (onlineEl && typeof lastOnline === "number") {
      onlineEl.textContent = "250×250 · " + lastOnline + " онлайн";
    }
  }

  function applyCam() {
    stage.style.transform = "translate(" + camX + "px," + camY + "px) scale(" + scale + ")";
    zl.textContent = Math.round(scale * 100) + "%";
    drawGrid();
  }

  function fit() {
    var vw = view.clientWidth;
    var vh = view.clientHeight;
    var s = Math.min(vw / W, vh / H) * 0.88;
    if (s < 0.35) s = 0.35;
    if (s > 8) s = 8;
    scale = s;
    camX = (vw - W * scale) / 2;
    camY = (vh - H * scale) / 2;
    applyCam();
  }

  function zoomAt(factor, cx, cy) {
    var next = scale * factor;
    if (next < 0.35) next = 0.35;
    if (next > 40) next = 40;
    factor = next / scale;
    camX = cx - (cx - camX) * factor;
    camY = cy - (cy - camY) * factor;
    scale = next;
    applyCam();
  }

  function paintSV() {
    svg.fillStyle = hsvToHex(HH, 1, 1);
    svg.fillRect(0, 0, 256, 140);

    var a = svg.createLinearGradient(0, 0, 256, 0);
    a.addColorStop(0, "#fff");
    a.addColorStop(1, "rgba(255,255,255,0)");
    svg.fillStyle = a;
    svg.fillRect(0, 0, 256, 140);

    a = svg.createLinearGradient(0, 0, 0, 140);
    a.addColorStop(0, "rgba(0,0,0,0)");
    a.addColorStop(1, "#000");
    svg.fillStyle = a;
    svg.fillRect(0, 0, 256, 140);
  }

  function syncColorUI() {
    color = hsvToHex(HH, SS, VV);
    knob.style.left = (SS * 100) + "%";
    knob.style.top = ((1 - VV) * 100) + "%";
    hueEl.value = Math.round(HH) % 360;
    chip.style.background = color;
    if (document.activeElement !== hexInput) {
      hexInput.value = color;
    }
    var bs = swatches.querySelectorAll(".sw");
    for (var i = 0; i < bs.length; i++) {
      bs[i].classList.toggle("on", bs[i].dataset.c === color);
    }
  }

  function setColor(c) {
    c = String(c || "").toLowerCase();
    if (!/^#[0-9a-f]{6}$/.test(c)) return;
    var t = hexToHsv(c);
    if (t[1] > 0 && t[2] > 0) HH = t[0];
    SS = t[1];
    VV = t[2];
    paintSV();
    syncColorUI();
  }

  function pickSV(e) {
    var r = sv.getBoundingClientRect();
    SS = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    VV = 1 - Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    syncColorUI();
  }

  svwrap.addEventListener("pointerdown", function (e) {
    svwrap.setPointerCapture(e.pointerId);
    pickSV(e);
    function m(ev) { pickSV(ev); }
    function u() {
      svwrap.removeEventListener("pointermove", m);
      svwrap.removeEventListener("pointerup", u);
    }
    svwrap.addEventListener("pointermove", m);
    svwrap.addEventListener("pointerup", u);
  });

  hueEl.addEventListener("input", function () {
    HH = +hueEl.value;
    paintSV();
    syncColorUI();
  });

  hexInput.addEventListener("input", function () {
    var t = hexInput.value.trim();
    if (t.charAt(0) !== "#") t = "#" + t;
    if (/^#[0-9a-fA-F]{6}$/.test(t)) setColor(t.toLowerCase());
  });

  for (var i = 0; i < COLORS.length; i++) {
    (function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sw";
      b.style.background = c;
      b.dataset.c = c;
      b.onclick = function () { setColor(c); };
      swatches.appendChild(b);
    })(COLORS[i]);
  }
  setColor("#111111");

  function cellFromEvent(e) {
    var r = view.getBoundingClientRect();
    var x = Math.floor((e.clientX - r.left - camX) / scale);
    var y = Math.floor((e.clientY - r.top - camY) / scale);
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    return [x, y];
  }

  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function beep() {
    if (!settings.sound) return;
    ensureAudio();
    if (!audioCtx) return;
    try {
      var t0 = audioCtx.currentTime;
      var o1 = audioCtx.createOscillator();
      var o2 = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o1.type = "sine";
      o2.type = "triangle";
      o1.frequency.setValueAtTime(520, t0);
      o1.frequency.exponentialRampToValueAtTime(280, t0 + 0.12);
      o2.frequency.setValueAtTime(780, t0);
      o2.frequency.exponentialRampToValueAtTime(420, t0 + 0.1);
      var vol = Math.max(0.0001, Math.min(1, settings.volume == null ? 0.6 : settings.volume) * 0.08);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o1.connect(g);
      o2.connect(g);
      g.connect(audioCtx.destination);
      o1.start(t0);
      o2.start(t0);
      o1.stop(t0 + 0.18);
      o2.stop(t0 + 0.18);
    } catch (e) {}
  }

  function placeFx(x, y, c) {
    if (!settings.fx || settings.reducedMotion) return;
    var size = Math.max(8, scale);
    var cx = camX + (x + 0.5) * scale;
    var cy = camY + (y + 0.5) * scale;
    var col = c === "#ffffff" ? "#cfcfd6" : c;

    function spawn(css, frames, ms) {
      var d = document.createElement("div");
      d.className = "fx";
      d.style.cssText = css;
      view.appendChild(d);
      d.animate(frames, { duration: ms, easing: "cubic-bezier(.16,.84,.24,1)" }).onfinish = function () {
        d.remove();
      };
    }

    spawn(
      "left:" + (cx - size / 2) + "px;top:" + (cy - size / 2) + "px;width:" + size + "px;height:" + size + "px;background:" + c + ";border-radius:2px;",
      [{ transform: "scale(.2)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }],
      220
    );
    spawn(
      "left:" + (cx - 16) + "px;top:" + (cy - 16) + "px;width:32px;height:32px;border:2px solid " + col + ";border-radius:50%;",
      [{ transform: "scale(.3)", opacity: .8 }, { transform: "scale(1.4)", opacity: 0 }],
      400
    );
  }

  async function place(x, y) {
    if (!me) {
      openAuthModal("register", [x, y]);
      return;
    }

    if (settings.confirmPlace && !confirm("Поставить пиксель сюда?")) return;
    if (placing) return;
    if (Date.now() - lastPlace < COOLDOWN) return;

    var key = x + "," + y;
    var prevCell = pixels[key];
    var prevColor = prevCell ? (prevCell.color ? prevCell.color : prevCell) : "#ffffff";
    if (String(prevColor).toLowerCase() === color) return;

    placing = true;
    setStatus("ставим пиксель...", "ok");

    try {
      var data = await api("/api/pixel", {
        method: "POST",
        body: { x: x, y: y, color: color }
      });

      lastPlace = Date.now();
      if (data.pixels) {
        pixels = data.pixels;
      } else {
        pixels[key] = { color: color, by: me.nick, at: Date.now() };
      }

      if (data.user) {
        me = data.user;
        if (me.progress) me.progress._localAt = Date.now();
      }

      redraw();
      refreshUserUI();
      beep();
      placeFx(x, y, color);
      setStatus("онлайн · " + me.nick, "ok");
    } catch (err) {
      if (err.status === 401) {
        token = "";
        me = null;
        localStorage.removeItem(TOKEN_KEY);
        refreshUserUI();
        setStatus("нужен вход", "err");
        openAuthModal("login", [x, y]);
      } else if (err.status === 429) {
        var wait = (err.data && err.data.wait) || COOLDOWN;
        lastPlace = Date.now() - (COOLDOWN - wait);
        setStatus("кулдаун", "ok");
      } else {
        setStatus(err.message || "ошибка сети", "err");
      }
    } finally {
      placing = false;
    }
  }

  var pointers = new Map();
  var drag = null;
  var moved = false;
  var pinchDist = 0;

  view.addEventListener("pointerdown", function (e) {
    ensureAudio();
    view.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
      drag = { x: e.clientX, y: e.clientY, camX: camX, camY: camY };
      moved = false;
    } else if (pointers.size === 2) {
      var pts = Array.from(pointers.values());
      pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      drag = null;
      moved = true;
    }
  });

  view.addEventListener("pointermove", function (e) {
    if (pointers.has(e.pointerId)) {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    }

    if (pointers.size === 2) {
      var pts = Array.from(pointers.values());
      var newDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchDist > 0 && newDist > 0) {
        var r = view.getBoundingClientRect();
        var midX = (pts[0].x + pts[1].x) / 2 - r.left;
        var midY = (pts[0].y + pts[1].y) / 2 - r.top;
        zoomAt(newDist / pinchDist, midX, midY);
      }
      pinchDist = newDist;
      return;
    }

    var c = cellFromEvent(e);
    if (!c) {
      hud.textContent = "—";
    } else {
      var cell = pixels[c[0] + "," + c[1]];
      var by = cell && cell.by ? cell.by : "";
      hud.textContent = by ? (c[0] + ", " + c[1] + " · " + by) : (c[0] + ", " + c[1]);
    }

    if (!drag) return;
    var dx = e.clientX - drag.x;
    var dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 4) moved = true;
    if (moved) {
      camX = drag.camX + dx;
      camY = drag.camY + dy;
      applyCam();
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchDist = 0;

    if (drag && !moved && pointers.size === 0) {
      var c = cellFromEvent(e);
      if (c) place(c[0], c[1]);
    }
    if (pointers.size === 0) {
      drag = null;
      moved = false;
    }
  }

  view.addEventListener("pointerup", endPointer);
  view.addEventListener("pointercancel", endPointer);
  view.addEventListener("pointerleave", function () { hud.textContent = "—"; });

  view.addEventListener("wheel", function (e) {
    e.preventDefault();
    var r = view.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  document.getElementById("zin").onclick = function () { zoomAt(1.3, view.clientWidth / 2, view.clientHeight / 2); };
  document.getElementById("zout").onclick = function () { zoomAt(0.77, view.clientWidth / 2, view.clientHeight / 2); };
  document.getElementById("btnCenter").onclick = fit;

  var btnGrid = document.getElementById("btnGrid");
  function syncGridBtn() {
    btnGrid.classList.toggle("on", !!settings.showGrid);
    btnGrid.textContent = settings.showGrid ? "Сетка ✓" : "Сетка";
  }
  syncGridBtn();

  btnGrid.onclick = function () {
    settings.showGrid = !settings.showGrid;
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
    syncGridBtn();
    drawGrid();
  };

  document.getElementById("btnShare").onclick = async function () {
    var url = location.origin + "/";
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(url);
        setStatus("ссылка скопирована", "ok");
        setTimeout(function () {
          setStatus(me ? ("онлайн · " + me.nick) : "онлайн · гость", serverReady ? "ok" : "");
        }, 1500);
      } else {
        prompt("Ссылка на поле:", url);
      }
    } catch (e) {
      prompt("Ссылка на поле:", url);
    }
  };

  document.getElementById("btnPng").onclick = function () {
    var s = 2;
    var out = document.createElement("canvas");
    out.width = W * s;
    out.height = H * s;
    var o = out.getContext("2d");
    o.imageSmoothingEnabled = false;
    o.fillStyle = "#fff";
    o.fillRect(0, 0, out.width, out.height);
    o.drawImage(cv, 0, 0, out.width, out.height);
    out.toBlob(function (b) {
      if (!b) return;
      var a = document.createElement("a");
      var objectUrl = URL.createObjectURL(b);
      a.href = objectUrl;
      a.download = "pixel-battle.png";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 1000);
    });
  };

  (function tick() {
    if (me && me.progress) {
      var p = me.progress;
      if (p.stamina < p.staminaMax && p.regenMs) {
        var now = Date.now();
        if (!p._localAt) p._localAt = now;
        var elapsed = now - p._localAt;
        if (elapsed >= p.regenMs) {
          var gain = Math.floor(elapsed / p.regenMs);
          p.stamina = Math.min(p.staminaMax, p.stamina + gain);
          p._localAt += gain * p.regenMs;
          p.nextIn = p.stamina >= p.staminaMax ? 0 : (p.regenMs - (now - p._localAt));
        } else {
          p.nextIn = p.regenMs - elapsed;
        }
      }
      updateProgressUI();
    }

    var left = Math.max(0, COOLDOWN - (Date.now() - lastPlace));
    if (left > 0 && me) {
      cdt.textContent = "Кулдаун " + Math.ceil(left / 1000) + " с";
    }
    requestAnimationFrame(tick);
  })();

  redraw();
  refreshUserUI();
  fit();

  var polling = false;
  var pollingStarted = false;

  async function refreshCanvas() {
    if (polling || document.hidden) return;
    polling = true;
    try {
      var data = await api("/api/canvas", { timeout: 20000 });
      pixels = data.pixels || {};
      if (typeof data.online === "number") lastOnline = data.online;
      redraw();
      setStatus(me ? ("онлайн · " + me.nick) : "онлайн · гость", "ok");
    } catch (e) {
      if (!serverReady) {
        setStatus("будим сервер (подождите 10–30 с)...", "");
      }
    } finally {
      polling = false;
    }
  }

  function startPolling() {
    if (pollingStarted) return;
    pollingStarted = true;
    setInterval(refreshCanvas, 8000);
  }

  async function wakeAndBoot() {
    setStatus("подключаемся к серверу...", "");

    // Пробуждение хоста с повторными попытками (важно для бесплатного Render)
    for (var attempt = 1; attempt <= 6; attempt++) {
      try {
        await api("/api/health", { timeout: 15000 });
        break;
      } catch (e) {
        if (attempt < 6) {
          setStatus("хост просыпается (попытка " + (attempt + 1) + ")...", "");
          await new Promise(function (r) { setTimeout(r, 2500); });
        } else {
          setStatus("сервер не отвечает — проверь запуск node server.js", "err");
        }
      }
    }

    if (token) {
      try {
        var meData = await api("/api/me");
        me = meData && meData.user ? meData.user : null;
        if (me && me.progress) me.progress._localAt = Date.now();
        refreshUserUI();
      } catch (err) {
        if (err.status === 401) {
          token = "";
          me = null;
          localStorage.removeItem(TOKEN_KEY);
          refreshUserUI();
        }
      }
    }

    await refreshCanvas();
    startPolling();
  }

  window.addEventListener("resize", fit);
  requestAnimationFrame(fit);
  wakeAndBoot();
})();
</script>
</body>
</html>
